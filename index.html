<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torn Loadout (V3.1)</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 8px;
    }
    h1 { text-align: center; }
    input, button, select {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .item {
      background: #1e293b;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .label { color: #facc15; }
    .ammo { color: #f472b6; margin-top: 4px; }
    .mod-text { color: #38bdf8; font-size: 12px; margin-top: 4px; }
    .warning { color: #f87171; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Torn Loadout (V3.1)</h1>

  <input id="apiKey" placeholder="API Key">
  <input id="userId" placeholder="User ID">

  <button id="loadBtn" onclick="loadData()">Load</button>
  <button onclick="downloadImage()">📸 Screenshot</button>

  <p id="status"></p>
  <div id="items"></div>

  <script>
    const weaponTypes = {
      "9mm Uzi":"SMG","AK74U":"SMG","P90":"SMG","MP5 Navy":"SMG","MP5k":"SMG",
      "Skorpion":"SMG","TMP":"SMG","BT MP9":"SMG",
      "AK-47":"Rifle","M4A1 Colt Carbine":"Rifle","SIG 550":"Rifle",
      "SIG 552":"Rifle","XM8 Rifle":"Rifle","SKS Carbine":"Rifle",
      "M249 SAW":"Machine Gun","Minigun":"Machine Gun","PKM":"Machine Gun",
      "Benelli M1 Tactical":"Shotgun","Benelli M4 Super":"Shotgun",
      "Ithaca 37":"Shotgun","Mag 7":"Shotgun",
      "Beretta 92FS":"Pistol","Glock 17":"Pistol","USP":"Pistol",
      "Fiveseven":"Pistol","Desert Eagle":"Pistol",
      "Flamethrower":"Heavy Artillery","RPG Launcher":"Heavy Artillery"
    };

    const ammoMap = {
      "9mm Parabellum Round":["9mm Uzi","MP5 Navy","MP5k","TMP","Glock 17","Beretta 92FS","USP","Skorpion"],
      "5.56mm Rifle Round":["M4A1 Colt Carbine","SIG 550","SIG 552","XM8 Rifle"],
      "7.62mm Rifle Round":["AK-47","SKS Carbine"],
      "12 Gauge Cartridge":["Benelli M1 Tactical","Benelli M4 Super","Ithaca 37","Mag 7"],
      "5.7mm High Vel. Round":["P90","Fiveseven"],
      "Liter of Fuel":["Flamethrower"]
    };

    const modStats = {
      Sight:"+Accuracy",
      Laser:"+Crit",
      Suppressor:"+Stealth -DMG",
      "Extended Mag":"+Mag Size",
      Trigger:"+Turn1 ACC",
      Grip:"+Accuracy",
      Choke:"+Damage",
      Brake:"+Accuracy -Stealth"
    };

    const allowedMods = {
      "Machine Gun":["Sight","Laser","Extended Mag","Trigger","Brake","Grip"],
      "Pistol":["Sight","Suppressor","Laser","Extended Mag","Trigger","Grip"],
      "Rifle":["Sight","Suppressor","Laser","Extended Mag","Trigger","Grip"],
      "Shotgun":["Laser","Choke","Trigger","Grip"],
      "SMG":["Sight","Suppressor","Laser","Extended Mag","Trigger","Grip"],
      "Heavy Artillery":["Laser"]
    };

    function filterMods(itemName, modsList){
      let filtered=[...modsList];
      if(itemName.toLowerCase().includes("dual"))
        filtered=filtered.filter(m=>m!=="Extended Mag");
      if(["Magnum","S&W Revolver"].includes(itemName))
        filtered=filtered.filter(m=>m!=="Extended Mag");
      return filtered;
    }

    async function loadData(){
      const key=document.getElementById("apiKey").value.trim();
      const id=document.getElementById("userId").value.trim();
      const status=document.getElementById("status");
      const itemsDiv=document.getElementById("items");
      const btn=document.getElementById("loadBtn");
      btn.disabled=true;
      status.innerText="Loading...";
      itemsDiv.innerHTML="";
      try{
        const eq=await fetch(`https://api.torn.com/user/${id}?selections=equipment&key=${key}`).then(r=>r.json());
        const ammo=await fetch(`https://api.torn.com/user/${id}?selections=ammo&key=${key}`).then(r=>r.json());
        for(const item of (eq.equipment||[])){
          const detail=await fetch(`https://api.torn.com/torn/${item.UID}?selections=itemdetails&key=${key}`).then(r=>r.json());
          let matchedAmmo=null;
          if(ammo && ammo.ammo){
            for(const a of ammo.ammo){
              if(!a.equipped) continue;
              for(const type in ammoMap){
                if(ammoMap[type].includes(item.name)&&a.size===type){
                  matchedAmmo=a;break;
                }
              }
              if(matchedAmmo)break;
            }
          }
          renderItem(detail.itemdetails,matchedAmmo);
          await new Promise(r=>setTimeout(r,300));
        }
        status.innerText="Done ✅";
      }catch(e){ status.innerText="Error"; console.error(e); }
      btn.disabled=false;
    }

    function renderItem(item,ammo){
      const div=document.createElement("div");
      div.className="item";
      let html=`<b>${item.name}</b><br>${item.type}<br>`;
      if(item.damage) html+=`<span class='label'>DMG:</span> ${item.damage}<br>`;
      if(item.accuracy) html+=`<span class='label'>ACC:</span> ${item.accuracy}<br>`;
      if(item.armor) html+=`<span class='label'>DEF:</span> ${item.armor}<br>`;
      if(item.quality!==undefined) html+=`<span class='label'>Quality:</span> ${item.quality}<br>`;
      if(ammo) html+=`<div class='ammo'>${ammo.size} (${ammo.type})</div>`;

      if(["Primary","Secondary"].includes(item.type)){
        const category=weaponTypes[item.name];
        if(category && allowedMods[category]){
          const mods=filterMods(item.name,allowedMods[category]);
          html+=`<b>Mods:</b>`;
          for(let i=0;i<2;i++){
            html+=`<select onchange="updateMod(this)">
              <option value="">Select Mod</option>
              ${mods.map(m=>`<option>${m}</option>`).join("")}
            </select>
            <div class="mod-text"></div>`;
          }
        }
      }

      div.innerHTML=html;
      document.getElementById("items").appendChild(div);
    }

    function updateMod(el){
      const type=el.value;
      const box=el.nextElementSibling;
      box.innerHTML=modStats[type]||"";
    }

    function downloadImage(){
      html2canvas(document.body).then(canvas=>{
        const link=document.createElement("a");
        link.download="loadout.png";
        link.href=canvas.toDataURL();
        link.click();
      });
    }
  </script>
</body>
</html>
