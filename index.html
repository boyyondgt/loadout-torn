<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torn Loadout (V4.1)</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 8px;
    }
    h1 { text-align: center; }
    input, button, select {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .item {
      background: #1e293b;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .label { color: #facc15; }
    .ammo { color: #f472b6; margin-top: 4px; }
    .mod-text { color: #38bdf8; font-size: 12px; margin-top: 4px; }
    .warning { color: #f87171; font-size: 11px; margin-top: 4px; }
    .mod-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .mod-title {
      color: #facc15;
      font-weight: bold;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>Torn Loadout (V4.1)</h1>

  <input id="apiKey" placeholder="API Key" />
  <input id="userId" placeholder="User ID" />

  <button id="loadBtn" onclick="loadData()">Load</button>
  <button onclick="downloadImage()">📸 Screenshot</button>

  <p id="status"></p>
  <div id="items"></div>

  <script>
    const weaponTypes = {
      "9mm Uzi":"SMG","AK74U":"SMG","P90":"SMG","MP5 Navy":"SMG","MP5k":"SMG",
      "Skorpion":"SMG","TMP":"SMG","BT MP9":"SMG",
      "AK-47":"Rifle","M4A1 Colt Carbine":"Rifle","SIG 550":"Rifle",
      "SIG 552":"Rifle","XM8 Rifle":"Rifle","SKS Carbine":"Rifle",
      "M249 SAW":"Machine Gun","Minigun":"Machine Gun","PKM":"Machine Gun",
      "Benelli M1 Tactical":"Shotgun","Benelli M4 Super":"Shotgun",
      "Ithaca 37":"Shotgun","Mag 7":"Shotgun",
      "Beretta 92FS":"Pistol","Glock 17":"Pistol","USP":"Pistol",
      "Fiveseven":"Pistol","Desert Eagle":"Pistol",
      "Flamethrower":"Heavy Artillery","RPG Launcher":"Heavy Artillery",
      "Taser":"Mechanical"
    };

    const ammoMap = {
      "9mm Parabellum Round": ["9mm Uzi","MP5 Navy","MP5k","TMP","Glock 17","Beretta 92FS","USP","Skorpion"],
      "5.56mm Rifle Round": ["M4A1 Colt Carbine","SIG 550","SIG 552","XM8 Rifle"],
      "7.62mm Rifle Round": ["AK-47","SKS Carbine"],
      "12 Gauge Cartridge": ["Benelli M1 Tactical","Benelli M4 Super","Ithaca 37","Mag 7"],
      "5.7mm High Vel. Round": ["P90","Fiveseven"],
      "Dart": ["Blowgun"],
      "Liter of Fuel": ["Flamethrower"]
    };

    const modData = {
      Sight: [
        { tier: 1, name: "Reflex Sight", effect: "+1.00 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] }
      ],
      Laser: [
        { tier: 1, name: "1mW Laser", effect: "+2% Critical Hit Rate", weapons: ["Machine Gun","Pistol","Rifle","SMG"] }
      ]
      // kept shorter for demo; expand with tiers later
    };

    let cooldown = false;

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&","&amp;").replaceAll("'","&apos;")
        .replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }

    async function loadData() {
      if (cooldown) return;
      const btn = document.getElementById("loadBtn");
      const status = document.getElementById("status");
      const itemsDiv = document.getElementById("items");
      const key = document.getElementById("apiKey").value.trim();
      const id = document.getElementById("userId").value.trim();
      cooldown = true;
      btn.disabled = true;

      let t = 10;
      btn.innerText = `Wait ${t}s`;
      const timer = setInterval(() => {
        t--;
        btn.innerText = t > 0 ? `Wait ${t}s` : "Load";
        if (t <= 0){ clearInterval(timer); btn.disabled = false; cooldown = false; }
      },1000);

      status.innerText = "Loading...";
      itemsDiv.innerHTML = "";

      try {
        const eq = await fetch(`https://api.torn.com/user/${id}?selections=equipment&key=${key}`).then(r=>r.json());
        for (const item of (eq.equipment||[])) {
          const detail = await fetch(`https://api.torn.com/torn/${item.UID}?selections=itemdetails&key=${key}`).then(r=>r.json());
          renderItem(detail.itemdetails||{}, item);
        }
        status.innerText = "Done ✅";
      } catch(e){
        console.error(e); status.innerText="Error";
      }
    }

    function renderItem(item, sourceItem){
      const div=document.createElement("div");
      div.className="item";
      let html=`<b>${item.name||sourceItem.name}</b><br>${item.type||sourceItem.type}<br>`;
      if(item.damage) html+=`<span class="label">DMG:</span> ${item.damage}<br>`;
      if(item.accuracy) html+=`<span class="label">ACC:</span> ${item.accuracy}<br>`;
      if(item.quality) html+=`<span class="label">Quality:</span> ${item.quality}<br>`;

      // Bonus name only
      if(item.bonuses){
        const b=Object.values(item.bonuses)[0];
        html+=`<span class="label">Bonus:</span> ${b.bonus}<br>`;
      }

      html+=`<div class="mod-section"><div class="mod-title">Mods (2 slots)</div>`;
      for(let i=0;i<2;i++){
        html+=`<select class="mod-select"><option value="">Select mod</option>`;
        for(const cat in modData){
          modData[cat].forEach(m=>{
            html+=`<option>${m.name} (${cat})</option>`;
          });
        }
        html+=`</select><div class="mod-text"></div>`;
      }
      html+=`</div>`;
      div.innerHTML=html;
      document.getElementById("items").appendChild(div);
    }

    function downloadImage(){
      if(!window.html2canvas){ alert("html2canvas failed to load"); return; }
      html2canvas(document.body).then(canvas=>{
        const link=document.createElement("a");
        link.download="loadout.png";
        link.href=canvas.toDataURL();
        link.click();
      });
    }

    console.log("Torn Loadout V4.1 loaded");
  </script>
</body>
</html>
