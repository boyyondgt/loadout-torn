<!DOCTYPE html>
<html>
<head>
<title>Torn Loadout (Hardcore)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 8px;
}

h1 { text-align:center; }

input, button, select {
    width:100%;
    padding:8px;
    margin-top:6px;
    border-radius:8px;
    border:none;
}

button {
    background:#3b82f6;
    color:white;
}

.item {
    background:#1e293b;
    padding:8px;
    margin-top:8px;
    border-radius:8px;
    font-size:13px;
}

.label { color:#facc15; }
.ammo { color:#f472b6; }
.mod { color:#38bdf8; font-size:12px; }
.warning { color:#f87171; font-size:11px; }
</style>
</head>

<body>

<h1>Torn Loadout</h1>

<input id="apiKey" placeholder="API Key">
<input id="userId" placeholder="User ID">

<button id="loadBtn" onclick="loadData()">Load</button>
<button onclick="downloadImage()">📸 Screenshot</button>

<p id="status"></p>
<div id="items"></div>

<script>

// 🔫 FULL WEAPON MAP
const weaponTypes = {

"9mm Uzi":"SMG","AK74U":"SMG","Bushmaster Carbon 15":"SMG","Dual Bushmasters":"SMG",
"Dual MP5s":"SMG","Dual P90s":"SMG","Dual TMPs":"SMG","Dual Uzis":"SMG",
"MP 40":"SMG","MP5 Navy":"SMG","P90":"SMG","Thompson":"SMG",
"MP5k":"SMG","Pink Mac-10":"SMG","Skorpion":"SMG","TMP":"SMG","BT MP9":"SMG",

"AK-47":"Rifle","ArmaLite M-15A4":"Rifle","Enfield SA-80":"Rifle",
"Gold Plated AK-47":"Rifle","Heckler & Koch SL8":"Rifle","M16 A2 Rifle":"Rifle",
"M4A1 Colt Carbine":"Rifle","SIG 550":"Rifle","SIG 552":"Rifle",
"SKS Carbine":"Rifle","Steyr AUG":"Rifle","Tavor TAR-21":"Rifle",
"Vektor CR-21":"Rifle","XM8 Rifle":"Rifle",

"M249 SAW":"Machine Gun","Minigun":"Machine Gun","Negev NG-5":"Machine Gun",
"Neutrilux 2000":"Machine Gun","PKM":"Machine Gun","Prototype":"Machine Gun",
"Rheinmetall MG 3":"Machine Gun","Stoner 96":"Machine Gun",

"Benelli M1 Tactical":"Shotgun","Benelli M4 Super":"Shotgun","Ithaca 37":"Shotgun",
"Jackhammer":"Shotgun","Mag 7":"Shotgun","Nock Gun":"Shotgun",
"Sawed-Off Shotgun":"Shotgun","Blunderbuss":"Shotgun","Homemade Pocket Shotgun":"Shotgun",

"Beretta 92FS":"Pistol","Beretta M9":"Pistol","Beretta Pico":"Pistol",
"Cobra Derringer":"Pistol","Desert Eagle":"Pistol","Dual 92G Berettas":"Pistol",
"Fiveseven":"Pistol","Flare Gun":"Pistol","Glock 17":"Pistol",
"Lorcin 380":"Pistol","Luger":"Pistol","Magnum":"Pistol",
"Qsz-92":"Pistol","Raven MP25":"Pistol","Ruger 57":"Pistol",
"S&W M29":"Pistol","S&W Revolver":"Pistol","Springfield 1911":"Pistol",
"Taurus":"Pistol","USP":"Pistol",

"Egg Propelled Launcher":"Heavy Artillery","Snow Cannon":"Heavy Artillery",
"Type 98 Anti Tank":"Heavy Artillery","China Lake":"Heavy Artillery",
"Flamethrower":"Heavy Artillery","Milkor MGL":"Heavy Artillery",
"RPG Launcher":"Heavy Artillery","SMAW Launcher":"Heavy Artillery"
};

// 🔧 MATRIX
const allowedMods = {
"Machine Gun":["Sight","Laser","Extended Mag","Trigger","Brake","Pod","Extra Clip","Recoil Pad","Grip"],
"Pistol":["Sight","Suppressor","Laser","Flashlight","Extended Mag","Trigger","Brake","Extra Clip","Grip"],
"Rifle":["Sight","Suppressor","Laser","Flashlight","Extended Mag","Trigger","Brake","Pod","Extra Clip","Recoil Pad","Grip"],
"Shotgun":["Laser","Flashlight","Choke","Trigger","Extra Clip","Recoil Pad","Grip"],
"SMG":["Sight","Suppressor","Laser","Flashlight","Extended Mag","Trigger","Brake","Extra Clip","Grip"],
"Heavy Artillery":["Laser","Pod","Extra Clip"]
};

// 🚫 SPECIAL RESTRICTIONS
function filterMods(itemName, category, modsList) {

    let filtered = [...modsList];

    const isDual = itemName.toLowerCase().includes("dual");
    const isRevolver = ["Magnum","S&W Revolver","S&W M29"].includes(itemName);
    const noMagShotguns = ["Ithaca 37","Nock Gun","Homemade Pocket Shotgun","Blunderbuss"];

    if (isDual) {
        filtered = filtered.filter(m => m !== "Extended Mag");
    }

    if (isRevolver) {
        filtered = filtered.filter(m => m !== "Extended Mag");
    }

    if (noMagShotguns.includes(itemName)) {
        filtered = filtered.filter(m => m !== "Extended Mag");
    }

    return { mods: filtered, isDual };
}

// 🔧 MOD EFFECTS
const modStats = {
    Sight:"+Accuracy",
    Laser:"+Crit",
    Suppressor:"+Stealth -DMG",
    Flashlight:"-Enemy ACC",
    "Extended Mag":"+Mag Size",
    Trigger:"+Turn1 ACC",
    Brake:"+ACC -Stealth",
    Grip:"+Accuracy",
    Choke:"+Damage",
    "Extra Clip":"+Mags",
    "Recoil Pad":"Ammo Save",
    Pod:"+ACC -DEX"
};

let cooldown = false;

// 🚀 LOAD
async function loadData() {

    if (cooldown) return;

    const btn = document.getElementById("loadBtn");
    cooldown = true;

    let t = 60;
    btn.disabled = true;

    let timer = setInterval(()=>{
        btn.innerText = `Wait ${t}s`;
        t--;
        if (t < 0) {
            clearInterval(timer);
            btn.innerText = "Load";
            btn.disabled = false;
            cooldown = false;
        }
    },1000);

    const key = apiKey.value;
    const id = userId.value;

    status.innerText = "Loading equipment...";
    items.innerHTML = "";

    try {

        const eq = await fetch(`https://api.torn.com/user/${id}?selections=equipment&key=${key}`).then(r=>r.json());
        const ammo = await fetch(`https://api.torn.com/user/${id}?selections=ammo&key=${key}`).then(r=>r.json());

        const equippedAmmo = ammo.ammo.find(a=>a.equipped===1);

        status.innerText = "Fetching details...";

        for (let item of eq.equipment) {

            if (!["Primary","Secondary","Melee","Defensive","Temporary"].includes(item.type)) continue;

            const detail = await fetch(`https://api.torn.com/torn/${item.UID}?selections=itemdetails&key=${key}`).then(r=>r.json());

            renderItem(detail.itemdetails, equippedAmmo);

            await new Promise(r=>setTimeout(r,400));
        }

        status.innerText = "Done ✅";

    } catch(e) {
        status.innerText = "Error";
    }
}

// 🎯 RENDER
function renderItem(item, ammo) {

    const div = document.createElement("div");
    div.className = "item";

    let html = `<b>${item.name}</b><br>${item.type}<br>`;

    if (item.damage) html += `<span class="label">DMG:</span> ${item.damage}<br>`;
    if (item.accuracy) html += `<span class="label">ACC:</span> ${item.accuracy}<br>`;
    if (item.armor) html += `<span class="label">DEF:</span> ${item.armor}<br>`;

    if (ammo && item.type !== "Defensive") {
        html += `<div class="ammo">${ammo.size} (${ammo.type})</div>`;
    }

    // 🔧 Mods
    if (["Primary","Secondary"].includes(item.type)) {

        const category = weaponTypes[item.name];

        if (category && allowedMods[category]) {

            const {mods, isDual} = filterMods(item.name, category, allowedMods[category]);

            html += `<b>Mods:</b>`;

            if (isDual) {
                html += `<div class="warning">Dual weapon → half mod effect</div>`;
            }

            for (let i=0;i<2;i++) {
                html += `
                <select onchange="updateMod(this, ${isDual})">
                    <option value="">Select Mod</option>
                    ${mods.map(m=>`<option>${m}</option>`).join("")}
                </select>
                <div class="mod"></div>
                `;
            }
        }
    }

    div.innerHTML = html;
    items.appendChild(div);
}

// 🔧 MOD DISPLAY
function updateMod(el, isDual) {

    const type = el.value;
    const box = el.nextElementSibling;

    if (!type) return box.innerHTML = "";

    let effect = modStats[type] || "";

    if (isDual) effect += " (½ effect)";

    box.innerHTML = effect;
}

// 📸 SCREENSHOT
function downloadImage() {
    html2canvas(document.body).then(canvas=>{
        let link = document.createElement("a");
        link.download = "loadout.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}

</script>

</body>
</html>
