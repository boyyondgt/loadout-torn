<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torn Loadout (V4.2)</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 8px;
    }
    h1 {
      text-align: center;
    }
    input, button, select {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    #controls {
      margin-bottom: 12px;
    }
    #loadout-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .col-head {
      color: #facc15;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .defensive-col, .offensive-col {
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 10px;
    }
    .defensive-col > .item,
    .offensive-col > .item {
      margin-top: 8px;
    }
    .item {
      background: #1e293b;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .label {
      color: #facc15;
    }
    .ammo {
      color: #f472b6;
      margin-top: 4px;
    }
    .bonus {
      color: #4ade80;
      font-size: 12px;
      margin-top: 4px;
    }
    .mod-text {
      color: #38bdf8;
      font-size: 12px;
      margin-top: 4px;
      white-space: pre-wrap;
    }
    .mod-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .mod-title {
      color: #facc15;
      font-weight: bold;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>Torn Loadout (V4.2)</h1>

  <div id="controls">
    <input id="apiKey" placeholder="API Key" />
    <button id="loadBtn" onclick="loadData()">Load</button>
  </div>

  <button id="screenshotBtn" onclick="downloadImage()">📸 Screenshot (loadout only)</button>

  <p id="status"></p>

  <div id="loadout-main">
    <!-- offensive: left -->
    <div id="offensive-col" class="offensive-col">
      <div class="col-head">Offensive</div>
    </div>
    <!-- defensive: right -->
    <div id="defensive-col" class="defensive-col">
      <div class="col-head">Defensive</div>
    </div>
  </div>

  <script>
    // EQUIPPED SLOTS (V4.1 order)

    // Secondary:   2
    // Melee:       3
    // Helmet:      6
    // Body:        4
    // Pants:       7
    // Gloves:      9
    // Boots:       8
    // Temporary:   5

    const allowedTypes = ["Primary", "Secondary", "Melee", "Defensive", "Temporary"];

    const weaponTypes = {
  // PRIMARY – SMG

  "Enfield SA-80": "Rifle",
  "Gold Plated AK-47": "Rifle",
  "Heckler & Koch SL8": "Rifle",
  "Ithaca 37": "Shotgun",
  "Jackhammer": "Shotgun",
  "M16 A2 Rifle": "Rifle",
  "M249 SAW": "Machine Gun",
  "M4A1 Colt Carbine": "Rifle",
  "Mag 7": "Shotgun",
  "Minigun": "Machine Gun",
  "MP 40": "SMG",
  "MP5 Navy": "SMG",
  "Negev NG-5": "Machine Gun",
  "Neutrilux 2000": "Machine Gun",
  "Nock Gun": "Shotgun",
  "P90": "SMG",
  "PKM": "Machine Gun",
  "Prototype": "Machine Gun",
  "Rheinmetall MG 3": "Machine Gun",
  "RPG Launcher": "Heavy Artillery",
  "Sawed-Off Shotgun": "Shotgun",
  "SIG 550": "Rifle",
  "SIG 552": "Rifle",
  "SKS Carbine": "Rifle",
  "Snow Cannon": "Heavy Artillery",
  "Steyr AUG": "Rifle",
  "Stoner 96": "Machine Gun",
  "Tavor TAR-21": "Rifle",
  "Thompson": "SMG",
  "Vektor CR-21": "Rifle",
  "XM8 Rifle": "Rifle",

  // SECONDARY
  "Type 98 Anti Tank": "Heavy Artillery",
  "Beretta 92FS": "Pistol",
  "Beretta M9": "Pistol",
  "Beretta Pico": "Pistol",
  "Blowgun": "Piercing",
  "Blunderbuss": "Shotgun",
  "BT MP9": "SMG",
  "China Lake": "Heavy Artillery",
  "Cobra Derringer": "Pistol",
  "Crossbow": "Piercing",
  "Desert Eagle": "Pistol",
  "Dual 92G Berettas": "Pistol",
  "Fiveseven": "Pistol",
  "Flamethrower": "Heavy Artillery",
  "Flare Gun": "Pistol",
  "Glock 17": "Pistol",
  "Harpoon": "Piercing",
  "Homemade Pocket Shotgun": "Shotgun",
  "Lorcin 380": "Pistol",
  "Luger": "Pistol",
  "Magnum": "Pistol",
  "Milkor MGL": "Heavy Artillery",
  "MP5k": "SMG",
  "Pink Mac-10": "SMG",
  "Qsz-92": "Pistol",
  "Raven MP25": "Pistol",
  "Ruger 57": "Pistol",
  "S&W M29": "Pistol",
  "S&W Revolver": "Pistol",
  "Skorpion": "SMG",
  "Slingshot": "Clubbing",
  "SMAW Launcher": "Heavy Artillery",
  "Springfield 1911": "Pistol",
  "Taser": "Mechanical",
  "Taurus": "Pistol",
  "TMP": "SMG",
  "Tranquilizer Gun": "Piercing",
  "USP": "Pistol"
};

    const modData = {
      Sight: [
        { tier: 1, name: "Reflex Sight", effect: "+1.00 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 2, name: "Holographic Sight", effect: "+1.25 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 3, name: "Acog Sight", effect: "+1.50 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 4, name: "Thermal Sight", effect: "+1.75 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] }
      ],
      Laser: [
        { tier: 1, name: "1mW Laser", effect: "+2% Critical Hit Rate", weapons: ["Machine Gun", "Pistol", "Rifle", "Heavy Artillery", "Shotgun", "SMG", "Mechanical"] },
        { tier: 2, name: "5mW Laser", effect: "+3% Critical Hit Rate", weapons: ["Machine Gun", "Pistol", "Rifle", "Heavy Artillery", "Shotgun", "SMG", "Mechanical"] },
        { tier: 3, name: "30mW Laser", effect: "+4% Critical Hit Rate", weapons: ["Machine Gun", "Pistol", "Rifle", "Heavy Artillery", "Shotgun", "SMG", "Mechanical"] },
        { tier: 4, name: "100mW Laser", effect: "+5% Critical Hit Rate", weapons: ["Machine Gun", "Pistol", "Rifle", "Heavy Artillery", "Shotgun", "SMG", "Mechanical"] }
      ],
      Suppressor: [
        { tier: 1, name: "Small Suppressor", effect: "+3 Stealth, -5% Damage", weapons: ["Pistol", "Rifle", "SMG"] },
        { tier: 2, name: "Standard Suppressor", effect: "+4 Stealth, -5% Damage", weapons: ["Pistol", "Rifle", "SMG"] },
        { tier: 3, name: "Large Suppressor", effect: "+5 Stealth, -5% Damage", weapons: ["Pistol", "Rifle", "SMG"] }
      ],
      ExtendedMag: [
        { tier: 1, name: "Extended Mags", effect: "+20% Clip Size", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 2, name: "High Capacity Mags", effect: "+30% Clip Size", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] }
      ],
      ExtraMag: [
        { tier: 1, name: "Extra Mag", effect: "One extra mag", weapons: ["Heavy Artillery", "Machine Gun", "Shotgun", "Pistol", "Rifle", "SMG", "Mechanical"] },
        { tier: 2, name: "Extra Mags x2", effect: "Two extra mags", weapons: ["Heavy Artillery", "Machine Gun", "Shotgun", "Pistol", "Rifle", "SMG", "Mechanical"] }
      ],
      Trigger: [
        { tier: 1, name: "Adjustable Trigger", effect: "+5.00 Accuracy on the first turn", weapons: ["Machine Gun", "Pistol", "Rifle", "Shotgun", "SMG"] },
        { tier: 2, name: "Hair Trigger", effect: "+7.50 Accuracy on the first turn", weapons: ["Machine Gun", "Pistol", "Rifle", "Shotgun", "SMG"] }
      ],
      Mount: [
        { tier: 1, name: "Bipod", effect: "+1.75 Accuracy, -30% Dexterity", weapons: ["Machine Gun", "Rifle", "Heavy Artillery"] },
        { tier: 2, name: "Tripod", effect: "+2.00 Accuracy, -30% Dexterity", weapons: ["Machine Gun", "Rifle", "Heavy Artillery"] }
      ],
      Grip: [
        { tier: 1, name: "Custom Grip", effect: "+0.75 Accuracy", weapons: ["Machine Gun", "Pistol", "Rifle", "Shotgun", "SMG"] }
      ],
      Choke: [
        { tier: 1, name: "Skeet Choke", effect: "+6% Damage", weapons: ["Shotgun"] },
        { tier: 2, name: "Improved Choke", effect: "+8% Damage", weapons: ["Shotgun"] },
        { tier: 3, name: "Full Choke", effect: "+10% Damage", weapons: ["Shotgun"] }
      ],
      RecoilPad: [
        { tier: 1, name: "Recoil Pad", effect: "25% ammo conservation", weapons: ["Machine Gun", "Rifle", "Shotgun"] }
      ],
      Brake: [
        { tier: 1, name: "Standard Brake", effect: "+1.00 Accuracy, -3 Stealth", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 2, name: "Heavy Duty Brake", effect: "+1.25 Accuracy, -3 Stealth", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] },
        { tier: 3, name: "Tactical Brake", effect: "+1.50 Accuracy, -3 Stealth", weapons: ["Machine Gun", "Pistol", "Rifle", "SMG"] }
      ],
      Light: [
        { tier: 1, name: "Small Light", effect: "-3.00 Opponent Accuracy, -2 Opponent Stealth", weapons: ["Pistol", "Rifle", "Shotgun", "SMG", "Mechanical"] },
        { tier: 2, name: "Precision Light", effect: "-4.00 Opponent Accuracy, -2.5 Opponent Stealth", weapons: ["Pistol", "Rifle", "Shotgun", "SMG", "Mechanical"] },
        { tier: 3, name: "Tactical Illuminator", effect: "-5.00 Opponent Accuracy, -3 Opponent Stealth", weapons: ["Pistol", "Rifle", "Shotgun", "SMG", "Mechanical"] }
      ]
    };

    const noModWeapons = [
      "Blowgun"
    ];

    const noMagWeapons = [
      "Ithaca 37",
      "Blunderbuss",
      "Homemade Pocket Shotgun",
      "Magnum",
      "S&W Revolver"
    ];

    async function loadData() {
      const key = document.getElementById("apiKey").value.trim();
      const status = document.getElementById("status");
      const defDiv  = document.getElementById("defensive-col");
      const ofDiv   = document.getElementById("offensive-col");

      if (!key) {
        status.innerText = "Please enter an API key.";
        return;
      }

      status.innerText = "Validating key & fetching your ID...";
      defDiv.innerHTML  = "<div class='col-head'>Defensive</div>";
      ofDiv.innerHTML   = "<div class='col-head'>Offensive</div>";

      try {
        // 1) get ID directly from basic + key
        const basic = await fetch(
          `https://api.torn.com/user/?selections=basic&key=${key}&comment=TryItPage`
        ).then(r => r.json());

        if (!basic.player_id || !basic.name) {
          status.innerText = "Invalid key or missing basic data.";
          return;
        }

        const playerId = basic.player_id;
        const name     = basic.name;

        status.innerText = `Loading loadout for ${name} (ID: ${playerId})...`;

        // 2) fetch equipment for that ID using the same key
        const eq   = await fetch(
          `https://api.torn.com/user/${playerId}?selections=equipment&key=${key}`
        ).then(r => r.json());
        const ammo = await fetch(
          `https://api.torn.com/user/${playerId}?selections=ammo&key=${key}`
        ).then(r => r.json());

        // V4.1 ORDERING BY SLOT
        // offensive:  left  → 1=Primary, 2=Secondary, 3=Melee, 5=Temporary
        // defensive:  right → 6=Helmet, 4=Body, 7=Pants, 9=Gloves, 8=Boots

        // split into two ordered lists
        const offensive = [];
        const defensive = [];

        for (const item of (eq.equipment || [])) {
          if (!allowedTypes.includes(item.type)) continue;

          if (item.equipped === 1) offensive.push(item); // Primary
          if (item.equipped === 2) offensive.push(item); // Secondary
          if (item.equipped === 3) offensive.push(item); // Melee
          if (item.equipped === 5) offensive.push(item); // Temporary

          if (item.equipped === 6) defensive.push(item); // Helmet
          if (item.equipped === 4) defensive.push(item); // Body
          if (item.equipped === 7) defensive.push(item); // Pants
          if (item.equipped === 9) defensive.push(item); // Gloves
          if (item.equipped === 8) defensive.push(item); // Boots
        }

        // sort by equipped slot (1,2,3,5) and (6,4,7,9,8) in the order we just pushed
        offensive.sort((a, b) => a.equipped - b.equipped);
        defensive.sort((a, b) => a.equipped - b.equipped);

        // now load details and render, in correct order
        for (const item of offensive) {
          const detailResp = await fetch(
            `https://api.torn.com/torn/${item.UID}?selections=itemdetails&key=${key}`
          ).then(r => r.json());
          const details = detailResp.itemdetails || detailResp;

          let matchedAmmo = null;
          if (ammo && ammo.ammo) {
            for (const a of ammo.ammo) {
              if (!a.equipped) continue;
              for (const type in ammoMap) {
                if (ammoMap[type].includes(item.name) && a.size === type) {
                  matchedAmmo = a;
                  break;
                }
              }
              if (matchedAmmo) break;
            }
          }

          renderItem(details, matchedAmmo, false); // offensive → left column
        }

        for (const item of defensive) {
          const detailResp = await fetch(
            `https://api.torn.com/torn/${item.UID}?selections=itemdetails&key=${key}`
          ).then(r => r.json());
          const details = detailResp.itemdetails || detailResp;

          let matchedAmmo = null;
          if (ammo && ammo.ammo) {
            for (const a of ammo.ammo) {
              if (!a.equipped) continue;
              for (const type in ammoMap) {
                if (ammoMap[type].includes(item.name) && a.size === type) {
                  matchedAmmo = a;
                  break;
                }
              }
              if (matchedAmmo) break;
            }
          }

          renderItem(details, matchedAmmo, true); // defensive → right column
        }

        status.innerText = `✅ Loadout loaded for ${name} (ID: ${playerId})`;

      } catch (e) {
        console.error("loadData error:", e);
        status.innerText = "Error loading data.";
      }
    }
    // V4.2 – PART 2 starts here
    // Copy this whole block right after the loadData closing }
    function renderItem(item, ammo, isDefensive) {
      const div = document.createElement("div");
      div.className = "item";
      let html = `<b>${item.name}</b><br>${item.type}<br>`;

      if (item.damage) html += `<span class="label">DMG:</span> ${item.damage}<br>`;
      if (item.accuracy) html += `<span class="label">ACC:</span> ${item.accuracy}<br>`;
      if (item.armor) html += `<span class="label">DEF:</span> ${item.armor}<br>`;
      if (item.quality !== undefined)
        html += `<span class="label">Quality:</span> ${item.quality}<br>`;

      if (item.bonuses) {
        const bonusList = Object.values(item.bonuses);
        if (bonusList.length) {
          const b = bonusList[0];
          html += `<div class="bonus"><b>Bonus:</b> ${b.bonus}<br>${b.description} (${b.value}%)</div>`;
        }
      }

      if (ammo)
        html += `<div class="ammo">${ammo.size} (${ammo.type})</div>`;

      const wn    = item.name;
      const wType = weaponTypes[wn];

            if (noModWeapons.includes(wn)) {
        // no mod section at all
      } else if (["Primary", "Secondary"].includes(item.type) && wType !== undefined) {
        html += `<div class="mod-section"><div class="mod-title">Mods (2 slots)</div>`;
              
        for (let i = 0; i < 2; i++) {
          html += `<select class="mod-select" onchange="updateMod(this)">
            <option value="">Select mod</option>`;

          for (const cat in modData) {
            const mods = modData[cat];
            if (!mods.some(m => m.weapons.includes(wType))) continue;

            mods.forEach((m, idx) => {
              const value = `${cat}:${idx}`;
              const label = `${cat} | Tier ${m.tier} — ${m.name} (${m.effect})`;

              if (noMagWeapons.includes(wn) && (cat === "ExtendedMag" || cat === "ExtraMag")) {
                // skip magazine mods
              } else {
                html += `<option value="${value}">${label}</option>`;
              }
            });
          }

          html += `</select><div class="mod-text"></div>`;
        }

        html += `</div>`;
      }

      div.innerHTML = html;

      if (isDefensive)
        document.getElementById("defensive-col").appendChild(div);
      else
        document.getElementById("offensive-col").appendChild(div);
    }

    function updateMod(el) {
      const val  = el.value;
      const box  = el.nextElementSibling;
      if (!val) {
        box.innerHTML = "";
        return;
      }

      const [cat, idxStr] = val.split(":");
      const idx           = parseInt(idxStr, 10);
      const list          = modData[cat] || [];
      const mod           = list[idx];

      if (!mod) {
        box.innerHTML = "";
        return;
      }

      const txt = `${mod.name} (${mod.effect})`;
      box.innerHTML = txt;
    }

    function downloadImage() {
      const el = document.getElementById("loadout-main");
      html2canvas(el).then(canvas => {
        const link = document.createElement("a");
        link.download = "loadout.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
    // V4.2 – PART 2 ends here
    // Paste this directly after loadData } in Part 1
  </script>
</body>
</html>
